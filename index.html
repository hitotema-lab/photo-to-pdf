<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="BPv8VcQ2DVOe9eNkOQtFix6tyI0bpoHyuXy84butUnc" />
<meta name="description" content="手書きレポートの写真を、提出用のPDFにまとめる無料ツール。影を消して白黒くっきり、2MB以下などの容量上限に自動で収め、学籍番号・氏名でファイル名も付けます。写真は端末の中だけで処理され、どこにも送信されません。">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写真をPDFに｜手書きレポートを提出用PDFにまとめる（容量指定・無料）</title>
<link rel="canonical" href="https://hitotema-lab.github.io/photo-to-pdf/">
<meta property="og:title" content="写真をPDFに｜手書きレポートを提出用PDFに">
<meta property="og:description" content="手書きレポートの写真を、提出用のPDFにまとめる無料ツール。影を消して白黒くっきり、2MB以下などの容量上限に自動で収める。写真は端末の外に出ません。">
<meta property="og:url" content="https://hitotema-lab.github.io/photo-to-pdf/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#FAFBFD; --grid:#DCE4F2; --ink:#1C2754; --sub:#5A6488;
  --line:#C3CFE6; --mark:#F6E35A; --markink:#1C2754; --red:#C8283A;
  --card:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121830; --grid:#1D2647; --ink:#E6EBFA; --sub:#9CA6C8;
    --line:#33406B; --mark:#E8D44A; --markink:#121830; --red:#FF6B7A;
    --card:#18203D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121830; --grid:#1D2647; --ink:#E6EBFA; --sub:#9CA6C8;
  --line:#33406B; --mark:#E8D44A; --markink:#121830; --red:#FF6B7A;
  --card:#18203D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px; line-height:1.7;
}
main{max-width:560px; margin:0 auto; padding:28px 18px 120px}
h1{
  font-weight:900; font-size:2.25rem; line-height:1.15; margin:0 0 10px;
  letter-spacing:-0.01em;
}
h1 span{
  background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%);
  padding:0 2px;
}
.lead{color:var(--sub); margin:0 0 26px; font-size:.95rem}
h2{font-size:1.05rem; font-weight:700; margin:30px 0 10px}
.drop{
  display:block; border:2px dashed var(--line); border-radius:14px; background:var(--card);
  padding:26px 16px; text-align:center; cursor:pointer;
}
.drop:focus-within{outline:3px solid var(--mark); outline-offset:2px}
.drop strong{display:block; font-size:1.1rem}
.drop small{color:var(--sub)}
.drop input{position:absolute; opacity:0; width:1px; height:1px}
ol.pages{list-style:none; padding:0; margin:14px 0 0; display:grid; gap:10px}
ol.pages li{
  display:grid; grid-template-columns:auto 64px 1fr auto; align-items:center; gap:12px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px;
}
.num{font-weight:900; font-size:1.2rem; width:1.6em; text-align:center}
.thumb{width:64px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--line); background:#fff}
.name{font-size:.82rem; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.acts{display:flex; gap:4px}
.acts button{
  width:38px; height:38px; border-radius:9px; border:1px solid var(--line);
  background:transparent; color:var(--ink); font-size:1rem; cursor:pointer;
}
.acts button:disabled{opacity:.3}
.acts .del{color:var(--red)}
.empty{color:var(--sub); font-size:.9rem; margin:10px 0 0}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg label{position:relative}
.seg input{position:absolute; opacity:0}
.seg span{
  display:block; text-align:center; padding:10px 6px; border-radius:10px;
  border:1px solid var(--line); background:var(--card); font-size:.92rem; cursor:pointer; line-height:1.35;
}
.seg span small{display:block; color:var(--sub); font-size:.74rem}
.seg input:checked + span{background:var(--mark); color:var(--markink); border-color:var(--mark); font-weight:700}
.seg input:checked + span small{color:var(--markink)}
.seg input:focus-visible + span{outline:3px solid var(--ink); outline-offset:2px}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.fields .wide{grid-column:1 / -1}
.fields label{font-size:.82rem; color:var(--sub)}
.fields input{
  width:100%; font:inherit; font-size:1rem; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-top:2px;
}
.fields input:focus{outline:3px solid var(--mark); outline-offset:1px}
.limit{display:flex; align-items:center; gap:8px; margin-top:12px}
.limit label{font-weight:700}
.limit input{
  width:5.5em; font:inherit; font-size:1.1rem; font-weight:700; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:7px 10px; text-align:right;
}
.limit input:focus{outline:3px solid var(--mark); outline-offset:1px}
.hint{font-size:.82rem; color:var(--sub); margin:6px 0 0}
.preview{margin:10px 0 0; font-size:.88rem; color:var(--sub); word-break:break-all}
.preview b{color:var(--ink)}
.bar{
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
}
.bar-in{max-width:560px; margin:0 auto}
#make{
  width:100%; font:inherit; font-weight:900; font-size:1.1rem; padding:14px;
  border-radius:12px; border:0; background:var(--ink); color:var(--paper); cursor:pointer;
}
#make:disabled{opacity:.4; cursor:default}
#make:focus-visible{outline:3px solid var(--mark); outline-offset:2px}
#status{font-size:.85rem; color:var(--sub); text-align:center; margin:6px 0 0; min-height:1.4em}
#fallback{display:none; text-align:center; margin-top:6px}
#fallback a{color:var(--ink); font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1><span>写真をPDFに</span></h1>
  <p class="lead">手書きレポートを撮って、提出用のPDFにまとめます。写真はこの端末の中だけで処理され、どこにもアップロードされません。</p>

  <label class="drop">
    <input id="pick" type="file" accept="image/*" multiple>
    <strong>写真を追加</strong>
    <small>撮影するか、アルバムから選ぶ（複数OK）</small>
  </label>

  <h2>ページの順番</h2>
  <ol class="pages" id="pages"></ol>
  <p class="empty" id="empty">まだ写真がありません。</p>

  <h2>仕上がり</h2>
  <div class="seg" role="radiogroup" aria-label="仕上がり">
    <label><input type="radio" name="mode" value="bw" checked><span>白黒くっきり<small>影を消して文字を濃く</small></span></label>
    <label><input type="radio" name="mode" value="color"><span>カラー<small>撮ったまま</small></span></label>
  </div>

  <h2>ファイルの大きさ</h2>
  <div class="seg" role="radiogroup" aria-label="ファイルの大きさ">
    <label><input type="radio" name="size" value="limit" checked><span>上限に収める<small>提出の容量制限に合わせる</small></span></label>
    <label><input type="radio" name="size" value="m"><span>標準<small>ふつうはこれ</small></span></label>
    <label><input type="radio" name="size" value="s"><span>軽め<small>とにかく小さく</small></span></label>
    <label><input type="radio" name="size" value="l"><span>高画質<small>細かい字が多い時</small></span></label>
  </div>
  <div class="limit" id="limitBox">
    <label for="limit">上限</label>
    <input id="limit" type="number" inputmode="decimal" min="0.1" step="0.1" value="2">
    <span>MB以下</span>
  </div>
  <p class="hint" id="limitHint">この大きさに収まる範囲で、いちばんきれいな画質を自動で選びます。</p>

  <h2>ファイル名</h2>
  <div class="fields">
    <div><label for="sid">学籍番号</label><input id="sid" inputmode="numeric" autocomplete="off"></div>
    <div><label for="sname">氏名</label><input id="sname" autocomplete="off"></div>
    <div class="wide"><label for="stitle">課題名（なくてもOK）</label><input id="stitle" placeholder="例：予習レポート1" autocomplete="off"></div>
  </div>
  <p class="preview">保存名：<b id="fname">report.pdf</b></p>
</main>

<div class="bar"><div class="bar-in">
  <button id="make" disabled>PDFを作成して保存</button>
  <p id="status" aria-live="polite"></p>
  <p id="fallback"><a id="dl" href="#">PDFをダウンロード</a></p>
</div></div>

<script>
(function(){
  const pages = [];          // {file, url}
  const $ = id => document.getElementById(id);
  const list = $('pages'), empty = $('empty'), make = $('make'), status = $('status');

  function render(){
    list.innerHTML = '';
    pages.forEach((p, i) => {
      const li = document.createElement('li');
      const n = document.createElement('div'); n.className='num'; n.textContent = i+1;
      const img = document.createElement('img'); img.className='thumb'; img.src=p.url; img.alt=(i+1)+'ページ目';
      const nm = document.createElement('div'); nm.className='name'; nm.textContent = p.file.name || '写真';
      const acts = document.createElement('div'); acts.className='acts';
      const up = btn('↑', (i+1)+'ページ目を上へ', i===0, () => move(i,-1));
      const dn = btn('↓', (i+1)+'ページ目を下へ', i===pages.length-1, () => move(i,1));
      const del = btn('×', (i+1)+'ページ目を削除', false, () => remove(i)); del.className='del';
      acts.append(up, dn, del);
      li.append(n, img, nm, acts);
      list.appendChild(li);
    });
    empty.style.display = pages.length ? 'none' : 'block';
    make.disabled = pages.length === 0;
    if (!pages.length) status.textContent = '';
  }
  function btn(t, label, dis, fn){
    const b = document.createElement('button'); b.type='button'; b.textContent=t;
    b.setAttribute('aria-label', label); b.disabled = dis; b.onclick = fn; return b;
  }
  function move(i, d){ const j=i+d; [pages[i],pages[j]]=[pages[j],pages[i]]; render(); }
  function remove(i){ URL.revokeObjectURL(pages[i].url); pages.splice(i,1); render(); }

  $('pick').addEventListener('change', e => {
    for (const f of e.target.files){
      if (f.type && !f.type.startsWith('image/')) continue;
      pages.push({file:f, url:URL.createObjectURL(f)});
    }
    e.target.value = '';
    render();
  });

  // filename
  function clean(s){ return s.trim().replace(/[\\/:*?"<>|\s]+/g,'_'); }
  function filename(){
    const parts = [clean($('sid').value), clean($('sname').value), clean($('stitle').value)].filter(Boolean);
    return (parts.length ? parts.join('_') : 'report') + '.pdf';
  }
  ['sid','sname','stitle'].forEach(id => $(id).addEventListener('input', () => $('fname').textContent = filename()));

  const SIZES = { s:{max:1300, q:0.6}, m:{max:1900, q:0.72}, l:{max:2700, q:0.85} };
  const LADDER = [[2600,.85],[2300,.8],[2000,.75],[1800,.7],[1600,.65],[1400,.6],[1250,.55],[1100,.5],[950,.45],[800,.4],[680,.35]];
  function selectedSize(){ return document.querySelector('input[name=size]:checked').value; }
  function syncLimit(){
    const on = selectedSize() === 'limit';
    $('limitBox').style.display = on ? 'flex' : 'none';
    $('limitHint').style.display = on ? 'block' : 'none';
  }
  document.querySelectorAll('input[name=size]').forEach(r => r.addEventListener('change', syncLimit));
  function canvasBlob(c, q){ return new Promise(res => c.toBlob(res, 'image/jpeg', q)); }
  async function decode(blob){
    if (window.createImageBitmap){ try{ return await createImageBitmap(blob); }catch(e){} }
    const u = URL.createObjectURL(blob);
    try{ return await loadImg(u); } finally{ URL.revokeObjectURL(u); }
  }

  function loadImg(url){
    return new Promise((res, rej) => { const im = new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('load')); im.src=url; });
  }

  // shadow removal + contrast: divide by blurred illumination estimate
  function toBW(ctx, w, h){
    const src = ctx.getImageData(0,0,w,h); const d = src.data;
    const gray = new Uint8ClampedArray(w*h);
    for (let i=0,j=0;i<d.length;i+=4,j++) gray[j] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);

    // background estimate: shrink a lot, then stretch back (smooth)
    const sw = Math.max(8, Math.round(w/40)), sh = Math.max(8, Math.round(h/40));
    const small = document.createElement('canvas'); small.width=sw; small.height=sh;
    const sc = small.getContext('2d');
    // write grayscale to temp canvas for scaling
    const tmp = document.createElement('canvas'); tmp.width=w; tmp.height=h;
    const tc = tmp.getContext('2d'); const gd = tc.createImageData(w,h);
    for (let j=0,i=0;j<gray.length;j++,i+=4){ gd.data[i]=gd.data[i+1]=gd.data[i+2]=gray[j]; gd.data[i+3]=255; }
    tc.putImageData(gd,0,0);
    sc.imageSmoothingEnabled = true; sc.imageSmoothingQuality='high';
    sc.drawImage(tmp,0,0,sw,sh);
    // lift dark (ink) cells toward local paper by a max filter on the small image
    const sdat = sc.getImageData(0,0,sw,sh); const s = sdat.data; const copy = new Uint8ClampedArray(s);
    for (let y=0;y<sh;y++) for (let x=0;x<sw;x++){
      let m=0;
      for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
        const xx=Math.min(sw-1,Math.max(0,x+dx)), yy=Math.min(sh-1,Math.max(0,y+dy));
        const v=copy[(yy*sw+xx)*4]; if (v>m) m=v;
      }
      const k=(y*sw+x)*4; s[k]=s[k+1]=s[k+2]=m;
    }
    sc.putImageData(sdat,0,0);
    const bg = document.createElement('canvas'); bg.width=w; bg.height=h;
    const bc = bg.getContext('2d'); bc.imageSmoothingEnabled=true; bc.imageSmoothingQuality='high';
    bc.drawImage(small,0,0,w,h);
    const b = bc.getImageData(0,0,w,h).data;

    for (let j=0,i=0;j<gray.length;j++,i+=4){
      let n = gray[j] / Math.max(1, b[i]);       // 1.0 = paper
      let v;
      if (n >= 0.9) v = 255;
      else { const t = Math.max(0, n/0.9); v = Math.pow(t, 2.2) * 255; }
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(src,0,0);
  }

  async function prepare(mode, maxDim){
    const out = [];
    for (let i=0;i<pages.length;i++){
      status.textContent = `${i+1} / ${pages.length} ページを処理中…`;
      await new Promise(r => setTimeout(r, 0));
      const im = await loadImg(pages[i].url);
      let w = im.naturalWidth, h = im.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      const ctx = c.getContext('2d', {willReadFrequently:true});
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(im,0,0,w,h);
      if (mode === 'bw') toBW(ctx, w, h);
      out.push({blob: await canvasBlob(c, 0.92), w, h});
      c.width = c.height = 0;
    }
    return out;
  }

  async function encode(prep, maxDim, q){
    const out = [];
    for (const p of prep){
      const s = Math.min(1, maxDim / Math.max(p.w, p.h));
      const w = Math.round(p.w*s), h = Math.round(p.h*s);
      const im = await decode(p.blob);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(im,0,0,w,h);
      if (im.close) im.close();
      out.push({data: c.toDataURL('image/jpeg', q), w, h});
      c.width = c.height = 0;
    }
    return out;
  }

  function makePdf(enc){
    const { jsPDF } = window.jspdf;
    let pdf = null;
    for (const e of enc){
      const orient = e.w > e.h ? 'landscape' : 'portrait';
      if (!pdf) pdf = new jsPDF({unit:'mm', format:'a4', orientation:orient, compress:true});
      else pdf.addPage('a4', orient);
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      const m = 5, r = Math.min((pw-2*m)/e.w, (ph-2*m)/e.h);
      const dw = e.w*r, dh = e.h*r;
      pdf.addImage(e.data, 'JPEG', (pw-dw)/2, (ph-dh)/2, dw, dh, undefined, 'FAST');
    }
    return pdf.output('blob');
  }

  async function build(){
    const mode = document.querySelector('input[name=mode]:checked').value;
    const sel = selectedSize();
    if (sel !== 'limit'){
      const s = SIZES[sel];
      const prep = await prepare(mode, s.max);
      status.textContent = 'PDFにまとめています…';
      return { blob: makePdf(await encode(prep, s.max, s.q)) };
    }
    const limitMB = parseFloat(String($('limit').value).replace(',', '.'));
    if (!(limitMB > 0)) throw new Error('nolimit');
    const limitBytes = limitMB * 1000 * 1000;   // 厳しめ（1MB=100万バイト）で判定
    const prep = await prepare(mode, LADDER[0][0]);
    let last = null;
    for (let k=0;k<LADDER.length;k++){
      status.textContent = `${limitMB}MB以内に収まる画質を探しています…（${k+1}回目）`;
      await new Promise(r => setTimeout(r, 0));
      const blob = makePdf(await encode(prep, LADDER[k][0], LADDER[k][1]));
      if (blob.size <= limitBytes) return { blob, fitted:true };
      last = blob;
    }
    return { blob:last, fitted:false };
  }

  function mb(n){ return n < 1024*1024 ? Math.round(n/1024)+' KB' : (n/1024/1024).toFixed(1)+' MB'; }

  make.addEventListener('click', async () => {
    make.disabled = true; $('fallback').style.display='none';
    try{
      if (!window.jspdf) throw new Error('nolib');
      const r = await build();
      const blob = r.blob;
      const name = filename();
      status.textContent = r.fitted === false
        ? `上限まで小さくできませんでした（${mb(blob.size)}）。上限を上げるか、ページを減らしてください。`
        : `完成：${pages.length}ページ・${mb(blob.size)}`;
      showLink(blob, name);
    }catch(err){
      status.textContent = err && err.message === 'nolimit'
        ? '上限のMBを数字で入れてください。'
        : err && err.message === 'nolib'
        ? 'PDFを作る部品を読み込めませんでした。通信状態を確認して再読み込みしてください。'
        : '写真を読み込めませんでした。別の写真で試すか、枚数を減らしてください。';
    }
    make.disabled = pages.length === 0;
  });

  function showLink(blob, name){
    const a = $('dl');
    if (a.href.startsWith('blob:')) URL.revokeObjectURL(a.href);
    a.href = URL.createObjectURL(blob); a.download = name;
    a.textContent = '保存されないときはここ';
    $('fallback').style.display='block';
    a.click();   // そのままダウンロード
  }

  render();
  syncLimit();
})();
</script>
</body>
</html>
